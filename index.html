<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora de Esmalte Interior — The Hillcrest Company</title>
<style>
  :root{
    --green:#1e5c3f; --gold:#c9a227; --ink:#2b2b26; --mut:#8a8577;
    --bg:#f7f5ee; --card:#ffffff; --line:#e8e2d2; --soft:#fbf9f3;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:90px;}
  header{background:var(--green); color:#fff; padding:18px 16px 14px; position:relative;}
  .langwrap{position:absolute; top:14px; right:12px; display:flex; gap:6px;}
  .langbtn{background:rgba(255,255,255,.18); color:#fff; border:1.5px solid rgba(255,255,255,.65);
    border-radius:20px; padding:4px 12px; font-size:12px; font-weight:700; cursor:pointer;}
  .langbtn.on{background:#fff; color:var(--green); border-color:#fff;}
  header h1{margin:0; font-size:20px;}
  header p{margin:6px 0 0; font-size:12px; opacity:.92; line-height:1.45;}
  .brand{display:inline-block; background:#fff; border-radius:12px; padding:8px 16px;
    margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.18);}
  .brand img{display:block; height:46px; width:auto;}
  main{max-width:860px; margin:0 auto; padding:12px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(30,60,40,.06);}
  .card h2{margin:0 0 10px; font-size:15px; color:var(--green);}
  .note{font-size:11.5px; color:var(--mut); margin:8px 0 0; line-height:1.5;}
  label.f{display:block; font-size:11px; color:var(--mut); margin:0 0 3px;}
  input[type=number],input[type=text]{width:100%; padding:10px 10px; font-size:15px;
    border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);}
  input:focus{outline:2px solid var(--gold); outline-offset:-1px; border-color:var(--gold);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap;}
  button.big{flex:1 1 140px; padding:13px 10px; font-size:15px; border-radius:12px;
    border:1px solid var(--line); background:#fff; cursor:pointer; font-weight:600; color:var(--ink);}
  button.big.primary{background:var(--green); color:#fff; border-color:var(--green);}
  button.big.warn{background:#fff; color:#b04a3a; border-color:#e5c4bc;}
  button.big:active{transform:scale(.98);}
  /* radios */
  .radio3{display:grid; grid-template-columns:1fr; gap:8px;}
  .ropt{border:2px solid var(--line); border-radius:12px; padding:10px 12px; cursor:pointer;
    display:flex; gap:10px; align-items:flex-start; background:var(--soft);}
  .ropt.active{border-color:var(--gold); background:#fffdf4;}
  .ropt input{margin-top:3px; width:18px; height:18px; accent-color:var(--green); flex:none;}
  .ropt .rt{font-size:14px; font-weight:700;}
  .ropt .rs{font-size:11.5px; color:var(--mut); margin-top:2px; line-height:1.4;}
  /* checkboxes */
  .optrow{display:flex; gap:10px; align-items:flex-start; padding:9px 10px;
    border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:var(--soft);}
  .optrow input[type=checkbox]{width:20px; height:20px; margin-top:1px; accent-color:var(--green); flex:none;}
  .optrow .ot{font-size:14px; font-weight:600;}
  .optrow .os{font-size:11.5px; color:var(--mut); margin-top:2px;}
  .optrow .qty{margin-top:8px; max-width:170px;}
  .sublabel{font-size:12px; font-weight:700; color:var(--green); margin:12px 0 6px;}
  /* results */
  .line{display:flex; justify-content:space-between; gap:8px; padding:7px 2px;
    border-bottom:1px dashed var(--line); font-size:13.5px;}
  .line .amt{font-weight:700; white-space:nowrap;}
  .line .ld{font-size:11px; color:var(--mut);}
  #totalRow{display:flex; justify-content:space-between; align-items:center;
    padding:12px 2px 2px; font-size:17px; font-weight:800; color:var(--green);}
  /* rates */
  .rate{display:grid; grid-template-columns:1fr 110px; gap:8px; align-items:center;
    padding:6px 0; border-bottom:1px dashed var(--line); font-size:13px;}
  .rate input{text-align:right;}
  /* gaby modal */
  #gabyModal{position:fixed; inset:0; background:rgba(20,25,20,.55); display:none;
    align-items:flex-end; justify-content:center; z-index:60; padding:0;}
  #gabyModal.show{display:flex;}
  #gabySheet{background:#fff; border-radius:18px 18px 0 0; width:100%; max-width:560px;
    max-height:88vh; overflow:auto; padding:18px 16px 26px;}
  #gabySheet h2{margin:0 0 6px;}
  #gabySheet textarea{width:100%; min-height:84px; border:1px solid var(--line);
    border-radius:10px; padding:10px; font-size:14px; font-family:inherit; box-sizing:border-box;}
  #gabySum{font-size:13px; color:var(--mut); margin:8px 0;}
  #gabySum b{color:var(--ink);}
  /* share card */
  #shareCard{position:fixed; inset:0; background:rgba(20,25,20,.55); display:none;
    align-items:flex-end; justify-content:center; z-index:60;}
  #shareCard.show{display:flex;}
  #shareSheet{background:#fff; border-radius:18px 18px 0 0; width:100%; max-width:560px;
    max-height:88vh; overflow:auto; padding:18px 16px 26px;}
  #shareText{width:100%; min-height:150px; border:1px solid var(--line); border-radius:10px;
    padding:10px; font-size:12px; font-family:monospace; box-sizing:border-box;}
  #copyMsg{font-size:13px; color:var(--mut); margin:8px 0;}
  /* toast */
  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:#2b2b26; color:#fff; padding:11px 18px; border-radius:24px; font-size:13.5px;
    opacity:0; pointer-events:none; transition:all .25s; z-index:99; max-width:90vw; text-align:center;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .foot{text-align:center; font-size:11px; color:var(--mut); margin-top:14px;}
</style>
</head>

const t=k=>(STRINGS[lang]&&STRINGS[lang][k]!==undefined)?STRINGS[lang][k]:(STRINGS.es[k]!==undefined?STRINGS.es[k]:k);
const fill=(s,o)=>String(s).replace(/\{(\w+)\}/g,(_,k)=>o[k]!==undefined?o[k]:"");

/* ================= Estado ================= */
const RATE_DEFAULTS={
  rSlabStain:275,rSlabRe:150,rFullStain:350,rFullRe:225,
  rCloset:100,rFrench:300,
  rBase:2.5,rCasing:2.5,rCrown:3.5,rChairRail:2.5,rShoe:1.5,rWainscot:7,
  rWindow:175,
  rHinge:120,rHw:85,rDead:125
};
const RATE_KEYS=Object.keys(RATE_DEFAULTS);
function defaultState(){
  return {
    lang:"es",client:"",address:"",
    dSlabStain:0,dSlabRe:0,dFullStain:0,dFullRe:0,
    dCloset:0,dFrench:0,
    tBase:0,tCase:0,tCrown:0,tChair:0,tShoe:0,tWains:0,
    win:0,
    hinge:false,hw:false,dead:false,
    rates:Object.assign({},RATE_DEFAULTS)
  };
}
let state=defaultState();
function normalize(st){
  const d=defaultState();
  if(!st||typeof st!=="object") return d;
  const o=Object.assign(d,st);
  o.rates=Object.assign({},RATE_DEFAULTS,st.rates||{});
  ["dSlabStain","dSlabRe","dFullStain","dFullRe","dCloset","dFrench",
   "tBase","tCase","tCrown","tChair","tShoe","tWains","win"].forEach(k=>{o[k]=Math.max(0,+o[k]||0);});
  ["hinge","hw","dead"].forEach(k=>{o[k]=!!o[k];});
  o.lang=(o.lang==="en")?"en":"es";
  return o;
}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function loadState(){
  try{const raw=localStorage.getItem(LS_KEY); if(raw) state=normalize(JSON.parse(raw));}
  catch(e){state=defaultState();}
  lang=state.lang||"es";
}

/* ================= Cálculo ================= */
const num=v=>{v=+v;return isFinite(v)&&v>0?v:0;};
const fmt=n=>"$"+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>"$"+Math.round(+n).toLocaleString("en-US");
function calc(){
  const R=state.rates;
  const nSlabS=num(state.dSlabStain),nSlabR=num(state.dSlabRe);
  const nFullS=num(state.dFullStain),nFullR=num(state.dFullRe);
  const nStd=nSlabS+nSlabR+nFullS+nFullR;
  const nCloset=num(state.dCloset),nFrench=num(state.dFrench);
  const nWin=num(state.win);
  const lines=[];
  const push=(label,qty,unit,rate,amount)=>{lines.push({label,qty,unit,rate,amount:Math.round(amount*100)/100});};
  // Puertas
  if(nSlabS>0)push(fill(t("liSlabStain"),{n:nSlabS}),nSlabS,t("perDoor"),R.rSlabStain,nSlabS*R.rSlabStain);
  if(nSlabR>0)push(fill(t("liSlabRe"),{n:nSlabR}),nSlabR,t("perDoor"),R.rSlabRe,nSlabR*R.rSlabRe);
  if(nFullS>0)push(fill(t("liFullStain"),{n:nFullS}),nFullS,t("perDoor"),R.rFullStain,nFullS*R.rFullStain);
  if(nFullR>0)push(fill(t("liFullRe"),{n:nFullR}),nFullR,t("perDoor"),R.rFullRe,nFullR*R.rFullRe);
  if(nCloset>0)push(fill(t("liCloset"),{n:nCloset}),nCloset,t("perDoor"),R.rCloset,nCloset*R.rCloset);
  if(nFrench>0)push(fill(t("liFrench"),{n:nFrench}),nFrench,t("perDoor"),R.rFrench,nFrench*R.rFrench);
  // Molduras por pie lineal
  const trims=[
    [num(state.tBase),"liBase",R.rBase],
    [num(state.tCase),"liCasing",R.rCasing],
    [num(state.tCrown),"liCrown",R.rCrown],
    [num(state.tChair),"liChairRail",R.rChairRail],
    [num(state.tShoe),"liShoe",R.rShoe],
    [num(state.tWains),"liWainscot",R.rWainscot]
  ];
  let trimLF=0;
  trims.forEach(([lf,key,rate])=>{
    if(lf>0){trimLF+=lf;push(fill(t(key),{n:lf}),lf,t("perLF"),rate,lf*rate);}
  });
  // Ventanas
  if(nWin>0)push(fill(t("liWindow"),{n:nWin}),nWin,t("perWin"),R.rWindow,nWin*R.rWindow);
  // Extras (por puerta estándar)
  if(state.hinge&&nStd>0)push(fill(t("liHinge"),{n:nStd}),nStd,t("perDoor"),R.rHinge,nStd*R.rHinge);
  if(state.hw&&nStd>0)push(fill(t("liHw"),{n:nStd}),nStd,t("perDoor"),R.rHw,nStd*R.rHw);
  if(state.dead&&nStd>0)push(fill(t("liDead"),{n:nStd}),nStd,t("perDoor"),R.rDead,nStd*R.rDead);
  const total=lines.reduce((a,l)=>a+l.amount,0);
  return {lines,total:Math.round(total*100)/100,nStd,nCloset,nFrench,nWin,trimLF};
}
function scopeText(c){
  return c.nStd+" "+t("scopeDoors")+" · "+c.trimLF+" "+t("scopeTrim")+" · "+c.nWin+" "+t("scopeWin");
}

/* ================= Render ================= */
function escHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function render(){
  const c=calc();
  const box=$("linesList");
  if(!c.lines.length){
    box.innerHTML='<p class="note" style="margin:0;">—</p>';
  }else{
    box.innerHTML=c.lines.map(l=>
      '<div class="line"><span>'+escHtml(l.label)+
      (l.rate!=null?'<div class="ld">'+l.qty+' × '+fmt(l.rate)+'</div>':"")+
      '</span><span class="amt">'+fmt(l.amount)+'</span></div>').join("");
  }
  $("totalV").textContent=fmt(c.total);
}
function toast(msg){
  let e=$("toast");
  e.textContent=msg;e.className="show";
  clearTimeout(e._t);e._t=setTimeout(()=>{e.className="";},2200);
}

/* Extras checkboxes (built once, labels via applyLang) */
const EXTRAS=[
  {key:"hinge",t:"optHingeT",s:"optHingeS"},
  {key:"hw",t:"optHwT",s:"optHwS"},
  {key:"dead",t:"optDeadT",s:"optDeadS"}

function buildExtras(){
  $("extrasList").innerHTML=EXTRAS.map(x=>
    '<label class="optrow"><input type="checkbox" id="opt_'+x.key+'">'+
    '<span style="flex:1"><span class="ot" id="ot_'+x.key+'"></span><div class="os" id="os_'+x.key+'"></div>'+
    '</span></label>').join("");

      state[x.key]=e.target.checked;
      save();render();

/* Rates card (built once) */
const RATES_DEF=[
  ["rSlabStain"],["rSlabRe"],["rFullStain"],["rFullRe"],
  ["rCloset"],["rFrench"],
  ["rBase"],["rCasing"],["rCrown"],["rChairRail"],["rShoe"],["rWainscot"],
  ["rWindow"],
  ["rHinge"],["rHw"],["rDead"]
];
function buildRates(){
  $("ratesList").innerHTML=RATES_DEF.map(([k])=>
    '<div class="rate"><span id="rl_'+k+'"></span>'+
    '<input type="number" id="rate_'+k+'" min="0" step="0.01"></div>').join("");
  RATES_DEF.forEach(([k])=>{
    $("rate_"+k).addEventListener("input",e=>{
      const v=+e.target.value;
      state.rates[k]=(isFinite(v)&&v>=0)?v:RATE_DEFAULTS[k];
      save();render();
    });
  });
}
function syncRatesUI(){RATES_DEF.forEach(([k])=>{$("rate_"+k).value=state.rates[k];});}

function applyLang(){
  document.documentElement.lang=lang;
  const S=(id,k)=>{const e=$(id);if(e)e.textContent=t(k);};
  S("appTitle","appTitle");S("appSub","appSub");
  S("clientH","clientH");$("clientInput").placeholder=t("clientPh");
  S("addrH","addrH");$("addrInput").placeholder=t("addrPh");
  S("doorsH","doorsH");S("slabH","slabH");
  S("dSlabStainL","dSlabStainL");S("dSlabReL","dSlabReL");
  S("fullH","fullH");
  S("dFullStainL","dFullStainL");S("dFullReL","dFullReL");
  S("otherDoorsH","otherDoorsH");
  S("dClosetL","dClosetL");S("dFrenchL","dFrenchL");
  S("trimH","trimH");
  S("tBaseL","tBaseL");S("tCaseL","tCaseL");S("tCrownL","tCrownL");
  S("tChairL","tChairL");S("tShoeL","tShoeL");S("tWainsL","tWainsL");
  S("winH","winH");S("winL","winL");
  S("optsH","optsH");
  EXTRAS.forEach(x=>{S("ot_"+x.key,x.t);S("os_"+x.key,x.s);});
  S("resH","resH");S("totalL","totalL");S("resNote","resNote");
  S("ratesH","ratesH");S("ratesNote","ratesNote");
  RATES_DEF.forEach(([k])=>{S("rl_"+k,k);});
  S("resetT","resetT");S("resetSub","resetSub");
  S("priceT","priceT");S("priceSub","priceSub");
  S("pdfT","pdfT");S("shareH","shareH");
  S("copyT","copyT");S("closeT","closeT");
  S("verTag","verTag");
  S("gabyBtnT","gabyBtnT");S("gabyTitle","gabyTitle");S("gabyNote","gabyNote");
  S("gabyWillSend","gabyWillSend");S("gabyCommentL","gabyCommentL");
  S("gabySendT","gabySend");S("gabyCopyT","gabyCopy");S("gabyCloseT","gabyClose");
  const gc=$("gabyComment");if(gc)gc.placeholder=t("gabyCommentPh");
  $("langEs").classList.toggle("on",lang==="es");
  $("langEn").classList.toggle("on",lang==="en");
  render();
}
function setLang(l){
  lang=(l==="en")?"en":"es";state.lang=lang;save();
  applyLang();
}
/* Sync DOM from state (on load) */
function syncInputs(){
  $("clientInput").value=state.client||"";
  $("addrInput").value=state.address||"";
  const numIds=["dSlabStain","dSlabRe","dFullStain","dFullRe","dCloset","dFrench",
                "tBase","tCase","tCrown","tChair","tShoe","tWains","win"];
  numIds.forEach(id=>{$(id).value=state[id]||0;});
  EXTRAS.forEach(x=>{$("opt_"+x.key).checked=!!state[x.key];});
  syncRatesUI();
}
function initButtons(){
  $("langEs").addEventListener("click",()=>setLang("es"));
  $("langEn").addEventListener("click",()=>setLang("en"));
  $("clientInput").addEventListener("input",e=>{state.client=e.target.value;save();});
  $("addrInput").addEventListener("input",e=>{state.address=e.target.value;save();});
  const numIds=["dSlabStain","dSlabRe","dFullStain","dFullRe","dCloset","dFrench",
                "tBase","tCase","tCrown","tChair","tShoe","tWains","win"];
  numIds.forEach(id=>{
    $(id).addEventListener("input",e=>{state[id]=Math.max(0,+e.target.value||0);save();render();});
  });
  $("resetBtn").addEventListener("click",()=>{
    const keepRates=state.rates,keepLang=state.lang;
    state=defaultState();state.rates=keepRates;state.lang=keepLang;
    save();syncInputs();render();
    toast(t("resetToast"));
  });
  $("priceBtn").addEventListener("click",()=>{
    if(!confirm(t("priceConfirm")))return;
    state.rates=Object.assign({},RATE_DEFAULTS);
    save();syncRatesUI();render();

  });

  $("copyBtn").addEventListener("click",()=>{
    const ta=$("shareText");ta.select();
    try{document.execCommand("copy");toast(t("copied"));}catch(e){toast(t("copyManual"));}

  $("closeShare").addEventListener("click",()=>$("shareCard").classList.remove("show"));
  $("gabyBtn").addEventListener("click",openGabyModal);
  $("gabyClose").addEventListener("click",()=>$("gabyModal").classList.remove("show"));
  $("gabyModal").addEventListener("click",e=>{if(e.target===$("gabyModal"))$("gabyModal").classList.remove("show");});
  $("gabySend").addEventListener("click",sendGabyMail);
  $("gabyCopyBtn").addEventListener("click",copyGabyText);

/* ================= PDF del estimado ================= */
const pdfEsc=s=>String(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
const pdfSan=s=>String(s).replace(/[—–]/g,"-").replace(/['']/g,"'").replace(/[""]/g,'"')
  .replace(/…/g,"...").replace(/[^\x20-\x7E\xA0-\xFF]/g,"");
const PDD=()=>new Date().toISOString().slice(0,10);
function buildEnamelPdf(){
  const GREEN="0.118 0.361 0.247",GOLD="0.788 0.635 0.153",DARK="0.17 0.17 0.15",GRAY="0.54 0.52 0.47";
  const P={s:""};
  const T=(x,y,txt,size,bold,color)=>{P.s+="BT /F"+(bold?"2":"1")+" "+size+" Tf "+color+" rg "+x.toFixed(1)+" "+y.toFixed(1)+" Td ("+pdfEsc(pdfSan(txt))+") Tj ET\n";};
  const rect=(x,y,w,h,color)=>{P.s+=color+" rg "+x+" "+y+" "+w+" "+h+" re f\n";};
  const c=calc();
  // Logo + encabezado
  P.s+="q 150 0 0 32.4 36 730 cm /Im1 Do Q\n";
  T(36,706,t("pdfEstTitle"),13,true,DARK);
  let y=690;
  const info=((state.client||"").trim()?t("gbClient")+": "+state.client.trim()+"  ·  ":"")+
    ((state.address||"").trim()?t("pdfProject")+state.address.trim()+"  ·  ":"")+
    t("pdfDate")+PDD();
  T(36,y,info.length>100?info.slice(0,100):info,9,false,GRAY); y-=8;
  rect(36,y-4,540,2.5,GOLD); y-=14;
  T(36,y,t("gbScope")+": "+scopeText(c),9,false,GRAY);
  y-=26;
  // Tabla de conceptos
  const cx=[36,352,412,486],hw=[t("pdfThItem"),t("pdfThQty"),t("pdfThEach"),t("pdfThTotal")];
  rect(36,y-6,540,20,GREEN);
  hw.forEach((h,i)=>T(cx[i]+4,y,h,9,true,"1 1 1"));
  y-=24;
  c.lines.forEach((l,ri)=>{
    if(ri%2===0)rect(36,y-5,540,21,"0.97 0.96 0.92");
    const lbl=l.label.length>54?l.label.slice(0,54):l.label;
    T(cx[0]+4,y+2,lbl,8.5,false,DARK);
    T(cx[1]+4,y+2,String(l.qty),8.5,true,DARK);
    T(cx[2]+4,y+2,l.rate!=null?fmt(l.rate):"—",8.5,false,DARK);
    T(cx[3]+4,y+2,fmt(l.amount),8.5,true,DARK);
    y-=21;
  });
  y-=4;
  rect(36,y-6,540,22,"0.93 0.95 0.90");
  T(cx[0]+4,y,t("pdfTotal"),10,true,DARK);
  T(cx[3]+4,y,fmt(c.total),11,true,DARK);
  y-=34;
  T(36,y,t("pdfFootB"),8,false,GRAY); y-=16;
  T(36,y,t("pdfFootA"),9,true,GREEN);
  // Ensamblar PDF (1 página vertical)
  const objs=[];
  objs[1]="<< /Type /Catalog /Pages 2 0 R >>";
  objs[2]="<< /Type /Pages /Kids [3 0 R] /Count 1 >>";
  objs[3]="<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> /XObject << /Im1 7 0 R >> >> /Contents 6 0 R >>";
  objs[4]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objs[5]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  objs[6]="<< /Length "+P.s.length+" >>\nstream\n"+P.s+"endstream";
  objs[7]="<< /Type /XObject /Subtype /Image /Width "+LOGO_W+" /Height "+LOGO_H+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+LOGO_BIN.length+" >>\nstream\n"+LOGO_BIN+"endstream";
  let pdf="%PDF-1.4\n",offs=[0];
  for(let i=1;i<=7;i++){offs[i]=pdf.length;pdf+=i+" 0 obj\n"+objs[i]+"\nendobj\n";}
  const xoff=pdf.length;
  pdf+="xref\n0 8\n0000000000 65535 f \n";
  for(let i=1;i<=7;i++)pdf+="0000000000".slice(0,10-String(offs[i]).length)+offs[i]+" 00000 n \n";
  pdf+="trailer\n<< /Size 8 /Root 1 0 R >>\nstartxref\n"+xoff+"\n%%EOF";
  const bytes=new Uint8Array(pdf.length);
  for(let i=0;i<pdf.length;i++)bytes[i]=pdf.charCodeAt(i)&255;
  return bytes;
}
function estimateText(){
  const c=calc(),L=[];
  L.push("HILLCREST — "+t("pdfEstTitle"));
  if((state.client||"").trim())L.push(t("gbClient")+": "+state.client.trim());
  if((state.address||"").trim())L.push(t("pdfProject")+state.address.trim());
  L.push(t("pdfDate")+PDD());
  L.push(t("gbScope")+": "+scopeText(c));
  L.push("");
  c.lines.forEach(l=>{L.push("  "+l.label+": "+l.qty+(l.rate!=null?" × "+fmt(l.rate):"")+" = "+fmt(l.amount));});
  L.push("");
  L.push(t("pdfTotal")+": "+fmt(c.total));
  L.push(t("pdfFootA"));
  return L.join("\n");
}

  const card=$("shareCard"),msg=$("copyMsg");

  msg.textContent=t("pdfGenerating");
  try{
    const bytes=buildEnamelPdf();
    const blob=new Blob([bytes.buffer],{type:"application/pdf"});
    let file;
    try{file=new File([blob],"Estimado-Esmalte-Interior-Hillcrest.pdf",{type:"application/pdf"});}
    catch(fe){file=blob;}
    $("shareText").value=estimateText();
    let shared=false;
    if(navigator.canShare){
      try{
        if(navigator.canShare({files:[file]})){
          try{await navigator.share({files:[file],title:"Estimado Esmalte Interior Hillcrest"});msg.textContent=t("pdfShared");return;}
          catch(se){if(se&&se.name==="AbortError")return;}
        }
      }catch(ce){shared=false;}
    }
    if(!shared){
      const url=URL.createObjectURL(blob);
      let w=null;
      try{w=window.open(url,"_blank");}catch(oe){w=null;}
      if(w){msg.textContent=t("pdfOpened");}
      else{msg.innerHTML=t("pdfBlocked")+' <a href="'+url+'" target="_blank" rel="noopener">'+t("pdfOpenLink")+'</a>';}
      setTimeout(()=>URL.revokeObjectURL(url),120000);
    }
  }catch(err){msg.textContent=t("pdfFailed")+(err&&err.message?err.message:String(err));}
}

/* ================= Enviar a Gaby: traspaso por correo ================= */
const GABY_MAIL="projects@thehillcrestcompany.com";
function buildHandoff(){
  const c=calc();
  const data={
    v:1,
    calc:"interiorEnamel",
    client:state.client||"",
    address:state.address||"",
    date:new Date().toISOString().slice(0,10),
    lang:lang,
    inputs:{
      doors:{
        slabStain:num(state.dSlabStain),slabRe:num(state.dSlabRe),
        fullStain:num(state.dFullStain),fullRe:num(state.dFullRe),
        closet:num(state.dCloset),french:num(state.dFrench)
      },
      trimLF:{
        baseboard:num(state.tBase),casing:num(state.tCase),crown:num(state.tCrown),
        chairRail:num(state.tChair),shoe:num(state.tShoe),wainscot:num(state.tWains)
      },
      windows:num(state.win),
      extras:{hinge:state.hinge?1:0,hw:state.hw?1:0,deadbolt:state.dead?1:0},
      rates:Object.assign({},state.rates)
    },
    totals:{
      lines:c.lines.map(l=>({label:l.label,qty:l.qty,unit:l.unit,rate:l.rate,amount:l.amount})),
      total:c.total
    },
    comment:($("gabyComment").value||"").trim()
  };
  return data;
}
function handoffSubject(d){
  return "[InteriorEnamel-Gaby] "+(d.client||"")+(d.address?" — "+d.address:"");
}
function handoffBody(d){
  const lines=[];
  lines.push(t("gbClient")+": "+(d.client||"—"));
  if(d.address)lines.push(t("gbAddress")+": "+d.address);
  lines.push(t("gbDate")+": "+d.date);
  const c=calc();
  lines.push(t("gbScope")+": "+scopeText(c));
  lines.push("");
  lines.push(t("gbLines")+":");
  d.totals.lines.forEach(l=>{
    lines.push("  "+l.label+": "+l.qty+(l.rate!=null?" × $"+(+l.rate).toFixed(2):"")+" = $"+(+l.amount).toFixed(2));
  });
  lines.push("  "+t("gbTotal")+": $"+(+d.totals.total).toFixed(2));
  if(d.comment){lines.push("");lines.push(t("gbInstr")+": "+d.comment);}
  lines.push("");
  lines.push("---BEGIN-INTERIORENAMEL-DATA---");
  lines.push(JSON.stringify(d));
  lines.push("---END-INTERIORENAMEL-DATA---");
  return lines.join("\n");
}
function openGabyModal(){
  if(!(state.client||"").trim()){toast(t("gabyNeedClient"));return;}
  const d=buildHandoff();
  const bits=d.totals.lines
    .map(l=>"<b>"+escHtml(l.label)+"</b>: $"+(+l.amount).toLocaleString("en-US",{maximumFractionDigits:0}));
  const c=calc();
  $("gabySum").innerHTML=
    "<b>"+escHtml(d.client)+"</b>"+(d.address?" · "+escHtml(d.address):"")+
    "<br>"+escHtml(scopeText(c))+" · "+d.totals.lines.length+" "+(lang==="es"?"conceptos":"items")+"<br>"+bits.join(" · ");
  $("gabyModal").classList.add("show");
}
function sendGabyMail(){
  const d=buildHandoff();
  const href="mailto:"+GABY_MAIL+"?subject="+encodeURIComponent(handoffSubject(d))+"&body="+encodeURIComponent(handoffBody(d));
  toast(t("gabyMailOpen"));
  const a=document.createElement("a");a.href=href;a.style.display="none";
  document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);
  setTimeout(()=>$("gabyModal").classList.remove("show"),800);
}
function copyGabyText(){
  const d=buildHandoff();
  const txt=handoffSubject(d)+"\n\n"+handoffBody(d);
  const done=()=>toast(t("gabyHandoffCopied"));
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));}
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");done();}catch(e){toast(t("copyManual"));}
  ta.remove();
}
